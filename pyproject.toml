[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-execution-explorer"
version = "0.1.0"
description = "Record one vLLM 0.30.0 execution and replay it without inventing scheduler decisions."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
    "langsmith>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = [".", "instrumentation"]
testpaths = ["tests"]

[tool.setuptools]
packages = ["runner", "vllm_030"]
package-dir = {vllm_030 = "instrumentation/vllm_030"}

[tool.setuptools.package-data]
runner = ["*.json"]
